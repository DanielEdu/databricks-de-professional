# A sample job for autoloader.

resources:
  jobs:
    autoloader_job:
      name: autoloader_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      email_notifications:
       on_failure:
         - daniel.epr77@gmail.com

      tasks:
        - task_key: py-task
          spark_python_task:
            python_file: ../src/main.py
          environment_key: Default

      queue:
        enabled: true
    
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED


