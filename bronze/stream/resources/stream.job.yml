# A sample job for stream.

resources:
  jobs:
    sample_job:
      name: stream_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      email_notifications:
       on_failure:
         - daniel.epr77@gmail.com

      tasks:
        - task_key: books-tsk
          spark_python_task:
            python_file: ../src/books.py
          environment_key: Default
        - task_key: customer-tsk
          spark_python_task:
            python_file: ../src/customers.py
          environment_key: Default
        - task_key: orders-tsk
          spark_python_task:
            python_file: ../src/orders.py
          environment_key: Default

      queue:
        enabled: true
    
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
